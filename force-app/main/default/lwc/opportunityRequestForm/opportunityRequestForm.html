<template>
    <div class="slds-p-around_medium">
        
        <lightning-input 
            type="text" 
            label="Opportunity Name" 
            name="opportunityName"
            value={value.opportunityName} 
            onchange={handleInputChange}
            required>
        </lightning-input>

        <lightning-input 
            type="date" 
            label="Close Date" 
            name="closeDate"
            value={value.closeDate} 
            min={minCloseDate}
            message-when-range-underflow="Close Date must be today or later."
            onchange={handleInputChange}
            required>
        </lightning-input>

        <lightning-input 
            type="number"
            step="0.01"
            label="Amount" 
            name="amount"
            value={value.amount}
            onchange={handleInputChange}
            required>
        </lightning-input>

        <lightning-combobox 
            label="Stage" 
            name="stage"
            value={value.stage} 
            options={stageOptions}
            onchange={handleInputChange}>
        </lightning-combobox>

        <lightning-combobox
            label="Opportunity Type"
            name="opportunityType"
            value={value.opportunityType}
            options={opportunityTypeOptions}
            onchange={handleInputChange}>
        </lightning-combobox>

    </div>
</template>
